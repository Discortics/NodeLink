name: Build and Push Discortics NodeLink Staging

on:
  push:
    branches: [discortics-yt-proxy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Svelvo Registry
        uses: docker/login-action@v3
        with:
          registry: registry.svelvo.com
          username: ${{ secrets.SVELVO_REGISTRY_USERNAME }}
          password: ${{ secrets.SVELVO_REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.svelvo.com/discortics-nodelink:fork-dev
            registry.svelvo.com/discortics-nodelink:sha-${{ github.sha }}
